    <title>Catálogo de Productos</title>
    <!-- Tailwind CSS vía CDN -->

         <!-- Navbar -->
        <nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
            <div class="max-w-6xl mx-auto px-4">
                <div class="flex justify-between items-center h-16">
                    <!-- Logo -->
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">
                            S
                        </div>
                        <span class="text-xl font-bold text-gray-800 tracking-tight">ShopStyle</span>
                    </div>

                    <!-- Enlaces Desktop -->
                    <div class="hidden md:flex items-center space-x-8 text-gray-600 font-medium text-sm">
                        <a href="#" class="hover:text-blue-600 transition-colors">Inicio</a>
                        <a href="#" class="text-blue-600 border-b-2 border-blue-600 pb-1">Productos</a>
                        <a href="#" class="hover:text-blue-600 transition-colors">Ofertas</a>
                        <a href="#" class="hover:text-blue-600 transition-colors">Contacto</a>
                    </div>

                    <!-- Carrito / Acceso -->
                    <div class="flex items-center gap-4">
                        <div class="relative cursor-pointer py-2">
                            <span class="text-gray-700 font-bold text-sm">Carrito (0)</span>
                        </div>
                        <button class="bg-gray-900 text-white text-sm px-4 py-2 rounded-lg hover:bg-gray-800 transition-colors">
                            Mi Cuenta
                        </button>
                    </div>
                </div>
            </div>
        </nav>


    <main>

            <!-- BUSCADOR -->
    <section class="max-w-7xl mx-auto px-6 py-8">
        <div class="flex gap-4">
            <form class="flex gap-4 w-full" id="prd-search">
                <input type="text" placeholder="Buscar producto..."
                    class="flex-1 border border-zinc-700 rounded-xl px-4 py-3 outline-none focus:border-blue-500" />

                <button type="submit" class="bg-blue-600 px-6 rounded-xl text-white transition-opacity hover:opacity-80 cursor-pointer">
                    Buscar
                </button>
            </form>
        </div>
    </section>

    <!-- RESULTADOS -->
    <section class="max-w-7xl mx-auto px-6 pb-12">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-2xl font-bold">
                Resultados
            </h2>

            <span class="text-sm text-zinc-400">
                <span id="quantity">0</span> Productos encontrados
            </span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6" id="search-results">

        

        </div>
    </section>

    <section class="max-w-7xl mx-auto px-6 pb-12">

        <div class="grid grid-cols-5 gap-3"" id="productsContainer"></div>
